<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Site do Ricardo</title>
	<link rel="stylesheet" href="styles.css">

	<!-- FONTES -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

	<!-- ICONES -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">

</head>
<body>
	<header>
        <div class="header-controls">
            <button><span class="mdi mdi-dots-horizontal"></span></button>
            <button><span class="mdi mdi-chevron-left"></span></button>
            <button><span class="mdi mdi-chevron-right"></span></button>
        </div>
        <div class="header-search">
            <button><span class="mdi mdi-home"></span></button>
            <label><span class="mdi mdi-magnify"></span></label>
            <input type="text" name="" id="input-search">
        </div>
        <div class="header-menu">
            <button><span class="mdi mdi-bell"></span></button>
            <button><span class="mdi mdi-account-group"></span></button>
            <button><span class="mdi mdi-account"></span></button>
        </div>
    </header>

	<main></main>

	<footer></footer>
</body>
</html>
